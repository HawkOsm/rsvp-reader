# Runs on every pull request and push to main: the checks that block a merge
# (its `test` job is required by main's branch protection). Separate from
# native-check.yml (native builds, only when native files change) and
# deploy-app.yml (the PWA, deployed by hand): this one is fast, and never
# waits on either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 requires >= 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs

      # The smoke test from CONTRIBUTING.md, in a real browser, against the
      # build above: catches what unit tests can't (workers, layout, saving).
      - name: Install Chromium for the smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        run: pnpm exec playwright test

      - name: Upload the smoke test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Android manifest permission check
        run: |
          if [ -d android ]; then
            ./scripts/check-android-permissions.sh
          else
            echo "no android/ directory on this branch — skipping"
          fi
