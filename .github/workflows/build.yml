# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach binaries to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: rsvp-reader-linux-x86_64
          - os: windows-latest
            label: Windows
            artifact: rsvp-reader-windows-x86_64
          - os: macos-latest
            label: macOS
            artifact: rsvp-reader-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Qt needs these present even to rasterise icons off-screen.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icons.py --iconset build/rsvp-reader.iconset

      - name: Build .icns (macOS)
        if: runner.os == 'macOS'
        run: iconutil -c icns build/rsvp-reader.iconset -o share/rsvp-reader.icns

      - name: Build
        run: pyinstaller --clean --noconfirm rsvp-reader.spec

      # A build that cannot start is not a build.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/rsvp-reader --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\rsvp-reader.exe --version

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/rsvp-reader/rsvp-reader --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp dist/rsvp-reader out/${{ matrix.artifact }}
          chmod +x out/${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir out
          copy dist\rsvp-reader.exe out\${{ matrix.artifact }}.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          ditto -c -k --keepParent "dist/RSVP Reader.app" \
            "out/${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f -print
          gh release create "${GITHUB_REF_NAME}" \
            --title "RSVP Reader ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "

          These binaries bundle PyQt6 (GPL-3.0) and PyMuPDF (AGPL-3.0).
          The complete corresponding source is this repository at tag
          \`${GITHUB_REF_NAME}\`; the build is reproduced by
          \`pyinstaller rsvp-reader.spec\` against \`requirements.txt\`.

          Binaries are unsigned. macOS and Windows will warn on first run." \
            $(find artifacts -type f)
