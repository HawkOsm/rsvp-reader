# Build the Android app. The runners ship the Android SDK, so no toolchain
# needs installing locally to produce an installable APK.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Pin Gradle via a wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      # A debug build is what we ship: an unsigned release APK cannot be
      # installed, and the debug key needs no secrets.
      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rsvp-reader.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: rsvp-reader-android
          path: android/out/rsvp-reader.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/rsvp-reader.apk --clobber
