# On a version tag: build one download per platform and attach them to a
# draft GitHub release, to publish by hand once checked:
#   rsvp-reader-linux-x86_64.AppImage     (chmod +x and run)
#   rsvp-reader-windows-x86_64-setup.exe
#   rsvp-reader-macos-universal.dmg
#   rsvp-reader.apk
#   install.sh                            (Linux: installs this release's AppImage)
#   SHA256SUMS                            (checksums of all of the above)
# The Actions token has been refused permission to *create* a release
# (see docs/architecture/decisions.md's v0.2 log), so the publish job uploads into a draft
# you created yourself if it can't create one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release and upload assets

jobs:
  build:
    uses: ./.github/workflows/build-apps.yml
    secrets: inherit # the Android signing keystore, when set

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # The installer installs exactly this release, so it gets this tag
      # written in; then every download is checksummed, which it checks.
      - name: Add install.sh and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/@VERSION@/$TAG/" scripts/install.sh > out/install.sh
          grep -q "^VERSION=\"$TAG\"\$" out/install.sh
          (cd out && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "RSVP Reader $TAG" --notes "" \
              || { echo "::error::Couldn't create the release. Create a draft for $TAG yourself and re-run this job."; exit 1; }
          fi
          gh release upload "$TAG" out/* --clobber
