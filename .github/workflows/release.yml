# On a version tag: build one download per platform and attach them to a
# draft GitHub release, to publish by hand once checked:
#   rsvp-reader-linux-x86_64.AppImage     (chmod +x and run)
#   rsvp-reader-windows-x86_64-setup.exe
#   rsvp-reader-macos-universal.dmg
#   rsvp-reader.apk
# The Actions token has been refused permission to *create* a release
# (see DECISIONS.md's v0.2 log), so the publish job uploads into a draft
# you created yourself if it can't create one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release and upload assets

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --bundles appimage
            built: src-tauri/target/release/bundle/appimage/*.AppImage
            asset: rsvp-reader-linux-x86_64.AppImage
          - os: windows-latest
            args: --bundles nsis
            built: src-tauri/target/release/bundle/nsis/*-setup.exe
            asset: rsvp-reader-windows-x86_64-setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            built: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: rsvp-reader-macos-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 requires >= 22
          cache: pnpm

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build ${{ matrix.args }}

      - name: Give the download a plain name
        shell: bash
        run: mkdir out && cp ${{ matrix.built }} out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    # Secrets can't be read in a step's `if:`, so expose the one it tests here.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @capacitor/cli 8 requires >= 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # android/'s copy of the web app is gitignored — sync puts dist/ in it.
      - run: pnpm exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Gradle 8.x needs <= 21; see DECISIONS.md's Phase 8 log
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for 'tools', which current sdkmanager no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - run: ./tools/check-android-permissions.sh

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            ./gradlew assembleRelease
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building an unsigned debug APK instead."
            echo "See the plan's Phase 8 note: generate a release keystore yourself, never commit it,"
            echo "and add it (base64-encoded) plus its passwords as repo secrets to sign real releases."
            ./gradlew assembleDebug
          fi

      - name: Give the download a plain name
        run: |
          mkdir out
          apks=(android/app/build/outputs/apk/*/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "expected one APK, got: ${apks[*]}"; exit 1; }
          cp "${apks[0]}" out/rsvp-reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rsvp-reader.apk
          path: out/rsvp-reader.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "RSVP Reader $TAG" --notes "" \
              || { echo "::error::Couldn't create the release. Create a draft for $TAG yourself and re-run this job."; exit 1; }
          fi
          gh release upload "$TAG" out/* --clobber
