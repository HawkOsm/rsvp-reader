<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>RSVP Reader</title>
  <rect width="256" height="256" rx="56" fill="#16181d"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none"
        stroke="#32373f" stroke-width="3"/>

  <!-- focus guides, above and below the highlighted letter -->
  <g fill="#4a515d">
    <rect x="115" y="60" width="6" height="26" rx="3"/>
    <rect x="115" y="170" width="6" height="26" rx="3"/>
  </g>

  <!-- a word: letter blocks, with the optimal recognition point in red -->
  <g fill="#e6e8ec">
    <rect x="48"  y="104" width="22" height="48" rx="6"/>
    <rect x="76"  y="104" width="22" height="48" rx="6"/>
    <rect x="138" y="104" width="22" height="48" rx="6"/>
    <rect x="166" y="104" width="22" height="48" rx="6"/>
  </g>
  <rect x="104" y="104" width="28" height="48" rx="6" fill="#ff5a5f"/>
</svg>
