<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="color-scheme" content="dark">
<meta name="description" content="A local speed reader. Words one at a time, at a pace you set.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSVP Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>RSVP Reader</title>
</head>
<body>

<!-- ------------------------------------------------------ library -->
<section id="library" class="view active">
  <header class="bar">
    <h1>Library</h1>
    <button id="add-btn" class="primary">Add</button>
  </header>

  <div id="book-list" class="list"></div>

  <p id="empty" class="empty">
    Nothing here yet.<br>
    Tap <b>Add</b> to pick a PDF or text file.<br>
    <span class="dim">Files stay on this device.</span>
  </p>

  <footer class="bar foot">
    <span id="usage" class="dim"></span>
    <button id="about-btn" class="flat">About</button>
  </footer>
  <input type="file" id="file-input" accept=".pdf,.txt,.md,.markdown,.text,.rst,.org,text/plain,application/pdf" multiple hidden>
</section>

<!-- ------------------------------------------------------- reader -->
<section id="reader" class="view">
  <header class="bar">
    <button id="back-btn" class="flat">‹ Library</button>
    <span id="title" class="title"></span>
    <button id="page-btn" class="flat" hidden>Page</button>
  </header>

  <!-- tap zones: left = back a word, middle = play/pause, right = forward -->
  <div id="stage">
    <canvas id="word-canvas"></canvas>
    <div id="tap-back" class="tapzone" aria-label="Back one word"></div>
    <div id="tap-play" class="tapzone" aria-label="Play or pause"></div>
    <div id="tap-fwd" class="tapzone" aria-label="Forward one word"></div>
    <div id="hint-overlay" class="overlay">
      <span>tap to play</span>
    </div>
  </div>

  <div id="page-stage" hidden>
    <canvas id="page-canvas"></canvas>
  </div>

  <footer class="controls">
    <div id="scrub" class="scrub"><div id="scrub-fill"></div></div>
    <div class="row">
      <button id="play-btn" class="primary wide">Play</button>
      <span id="counter" class="dim"></span>
    </div>
    <div class="row">
      <label for="wpm">WPM</label>
      <input type="range" id="wpm" min="50" max="1500" step="10" value="300">
      <output id="wpm-out">300</output>
    </div>
  </footer>
</section>

<!-- -------------------------------------------------------- modal -->
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div id="modal-actions" class="actions"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
